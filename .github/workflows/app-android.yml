name: アプリ（Android）を作る
on:
  workflow_dispatch:
concurrency:
  group: app-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 部品を入れる
        run: npm install --no-audit --no-fund
      - name: Android のプロジェクトを作る
        run: npx cap add android
      - name: 位置情報の許可を足す（現在地のまわりを探すため）
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' $M
          cat $M
      - name: アイコンを作る
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff7aa0' --splashBackgroundColor '#ff7aa0'
      - name: 同期
        run: npx cap sync android
      - name: APK を作る
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon -q
      - uses: actions/upload-artifact@v4
        with:
          name: gachakatsu-android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
