# data/ や images/ が更新されたら、ページを作り直して Cloudflare Pages に公開する
name: サイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 0,6,15 * * *" # 日本時間 9時・15時・0時（在庫の更新と「NEW」表示の更新。公式サイトへの負担を考えて1日3回まで）

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 取り込みは時間がかかるので、決まった時間（と手動実行）のときだけ。デザインの修正などはすぐ公開する
      - name: 画像・店舗・在庫を取り込む
        if: github.event_name != 'push'
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node src/fetch-assets.js
        env:
          STOCK_IN_GITHUB: "0"
          SITE_URL: ${{ vars.SITE_URL || 'https://gacha-site.pages.dev' }}

      - name: 取り込んだものを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p lineup-src
          git add images lineup-src data/items.json data/stores.json data/stock.json data/backfill.json
          git diff --cached --quiet || (git commit -m "画像・店舗・在庫を自動取り込み" && git push)

      - name: ハートの数を読み込む（人気ランキング用）
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 "${SITE_URL:-https://gacha-site.pages.dev}/api/votes" -o data/votes.json || echo '{}' > data/votes.json
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gacha-site.pages.dev' }}

      - name: ページを作る
        run: node src/build.js
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gacha-site.pages.dev' }}

      - name: Cloudflare の在庫データベースを準備
        id: d1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          W="npx --yes wrangler@4"
          getid() { $W d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const x=a.find(d=>d.name==="gacha-stock");process.stdout.write(x?(x.uuid||x.id||""):"")}catch{}})'; }
          ID=$(getid)
          if [ -z "$ID" ]; then $W d1 create gacha-stock; ID=$(getid); fi
          if [ -z "$ID" ]; then echo "D1を用意できませんでした（APIトークンの権限を確認）"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml worker/wrangler.toml
          $W d1 execute gacha-stock --remote --file worker/schema.sql
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Pages に公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT_NAME || 'gacha-site' }}
        run: |
          W="npx --yes wrangler@4"
          # データベースが使えないときは、在庫の窓口なしで公開する（ページは在庫ファイルを読む）
          if [ "${{ steps.d1.outputs.ok }}" != "1" ]; then rm -f wrangler.toml; rm -rf functions; fi
          $W pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          $W pages deploy dist --project-name="$PROJECT" --branch=main

      - name: 在庫確認ワーカーを公開
        if: steps.d1.outputs.ok == '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx --yes wrangler@4 deploy
