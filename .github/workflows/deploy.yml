# data/ や images/ が更新されたら、ページを作り直して Cloudflare Pages に公開する
name: サイトを公開

on:
  push:
    branches: [main]
    # 11/10：Actions の無料枠のため、データだけの更新（毎日の自動作業：抽選情報・英語名・メルカリのリンク・ラインナップ名など）では公開しない。
    # 次の決まった時刻（0時・9時・15時）の公開でまとめて出る。プログラム・デザインを直したときは今までどおりすぐ公開
    paths-ignore:
      - "data/**"
      - "images/**"
      - "lineup-src/**"
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去の商品の取り込みを今すぐ進める"
        type: boolean
        default: false
  schedule:
    - cron: "0 15 * * *"   # 日本時間 0時：新作・写真の取り込み（1日1回）＋公開
    - cron: "0 0,6 * * *"  # 日本時間 9時・15時：取り込みなしで作り直して公開（在庫・NEW表示・お店の情報の更新）

# ふだんの公開（push）どうしは新しいほうだけ残す。取り込みをする定時・手動の公開は、push で取り消されないよう別のグループにする
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 取り込みは時間がかかるので、決まった時間（と手動実行）のときだけ。デザインの修正などはすぐ公開する
      - name: 画像・店舗・在庫を取り込む
        if: github.event_name != 'push'
        env:
          # 9時・15時は新作と写真の取り込みをしない（GitHub Actions の無料枠を節約するため。新作の確認は0時の1日1回で十分）
          LIGHT_RUN: ${{ github.event.schedule == '0 0,6 * * *' && '1' || '' }}
          STOCK_IN_GITHUB: "0"
          FORCE_BACKFILL: ${{ github.event.inputs.backfill == 'true' && '1' || '0' }}
          SITE_URL: https://gachapla.com
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node src/fetch-assets.js

      - name: 取り込んだものを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p lineup-src
          git add images lineup-src data/items.json data/stores.json data/stock.json data/backfill.json data/import-skip.json
          if ! git diff --cached --quiet; then
            git commit -m "画像・店舗・在庫を自動取り込み"
            # 取り込み中にほかの自動作業が push していることがあるので、取り込み直してから送る（最大3回）
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              sleep 3
            done
          fi

      - name: ハートの数・ガチャマップのお店を読み込む
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 "${SITE_URL:-https://gachapla.com}/api/votes" -o data/votes.json || echo '{}' > data/votes.json
          # お店の一覧は重いので、決まった時間の公開（1日3回）のときだけ新しく読む。ふだんの公開はサイト側のキャッシュ（3時間）を使う
          if [ "${{ github.event_name }}" = "push" ]; then Q=""; else Q="?fresh=1"; fi
          curl -fsS --max-time 30 "${SITE_URL:-https://gachapla.com}/api/shopdump$Q" -o data/shops-live.json || echo '{}' > data/shops-live.json
        env:
          SITE_URL: https://gachapla.com

      - name: ページを作る
        run: node src/build.js
        env:
          SITE_URL: https://gachapla.com

      - name: SNS（Threads・Instagram・Pinterest）用の画像を作る
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5 > /dev/null 2>&1 || true
          (fc-list | grep -qi "Noto Sans CJK") || (sudo apt-get install -y -qq fonts-noto-cjk > /dev/null 2>&1 || true)
          node src/social-img.js

      - name: Instagram リールの動画を作る
        continue-on-error: true
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true)
          node src/reel.js

      - name: Cloudflare の在庫データベースを準備
        id: d1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          W="npx --yes wrangler@4"
          getid() { $W d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const x=a.find(d=>d.name==="gacha-stock");process.stdout.write(x?(x.uuid||x.id||""):"")}catch{}})'; }
          ID=$(getid)
          if [ -z "$ID" ]; then $W d1 create gacha-stock; ID=$(getid); fi
          if [ -z "$ID" ]; then echo "D1を用意できませんでした（APIトークンの権限を確認）"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml worker/wrangler.toml
          $W d1 execute gacha-stock --remote --file worker/schema.sql
          $W d1 execute gacha-stock --remote --file worker/migrate.sql > /dev/null 2>&1 || true
          $W d1 execute gacha-stock --remote --file worker/fix.sql > /dev/null 2>&1 || true
          # ガチャマップのお店（公式の取扱店）を入れる。すでにあるお店は変えない
          node src/shops-seed-sql.js > /tmp/seed-shops.sql && $W d1 execute gacha-stock --remote --file /tmp/seed-shops.sql > /dev/null || echo "お店の登録に失敗（次回また試します）"
          node src/pin-revert-sql.js > /tmp/pin-revert.sql && if [ -s /tmp/pin-revert.sql ]; then $W d1 execute gacha-stock --remote --file /tmp/pin-revert.sql > /dev/null || echo "ピンの戻しに失敗（次回また試します）"; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Cloudflare Pages に公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT_NAME || 'gacha-site' }}
        run: |
          W="npx --yes wrangler@4"
          # データベースが使えないときは、在庫の窓口なしで公開する（ページは在庫ファイルを読む）
          if [ "${{ steps.d1.outputs.ok }}" != "1" ]; then rm -f wrangler.toml; rm -rf functions; fi
          $W pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          $W pages deploy dist --project-name="$PROJECT" --branch=main

      - name: 新しいページを検索サイトに知らせる（IndexNow：Bing・Naver など）
        continue-on-error: true
        env:
          INDEXNOW_DAYS: "3"
        run: node src/indexnow.js

      - name: 在庫確認ワーカーを公開
        if: steps.d1.outputs.ok == '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: npx --yes wrangler@4 deploy
