# data/ や images/ が更新されたら、ページを作り直して Cloudflare Pages に公開する
name: サイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 0,6,15 * * *" # 日本時間 9時・15時・0時（在庫の更新と「NEW」表示の更新。公式サイトへの負担を考えて1日3回まで）

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 取り込みは時間がかかるので、決まった時間（と手動実行）のときだけ。デザインの修正などはすぐ公開する
      - name: 画像・店舗・在庫を取り込む
        if: github.event_name != 'push'
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node src/fetch-assets.js
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gacha-site.pages.dev' }}

      - name: 取り込んだものを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images data/items.json data/stores.json data/stock.json data/backfill.json
          git diff --cached --quiet || (git commit -m "画像・店舗・在庫を自動取り込み" && git push)

      - name: ページを作る
        run: node src/build.js
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gacha-site.pages.dev' }}

      - name: Cloudflare Pages に公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 初回だけ Pages のプロジェクトを作る（すでにあれば何もしない）
          preCommands: npx wrangler pages project create ${{ vars.CF_PROJECT_NAME || 'gacha-site' }} --production-branch=main || true
          command: pages deploy dist --project-name=${{ vars.CF_PROJECT_NAME || 'gacha-site' }} --branch=main
