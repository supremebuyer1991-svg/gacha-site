<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X投稿用の画像</title>
<link rel="stylesheet" href="__FONTS__">
<style>body{margin:0;background:#f4f6fb;font-family:"Zen Maru Gothic",sans-serif}img{max-width:100%;display:block;margin:12px auto}p{text-align:center;color:#6b7194;font-size:13px}</style>
</head><body><p id="st">画像を作っています…</p><div id="out"></div>
<script>
// X（@gachapla）の投稿に付ける画像を作るページ。
// ?kind=pick&id=商品id / ?kind=feed&ids=a,b,c,d&title=… / ?kind=week
// 作った画像は window.name に入れる（このあと同じタブで x.com/compose/post を開くと受け取れる）。&add=1 で前の画像に足す（最大4枚）
(async function () {
  var q = new URLSearchParams(location.search), kind = q.get("kind") || "pick";
  var W = 1200, H = 675, F = '"Zen Maru Gothic","Yu Gothic","Hiragino Sans","Noto Sans CJK JP",sans-serif', FL = '"Fredoka",' + F;
  try { await Promise.all([document.fonts.load('900 40px "Zen Maru Gothic"'), document.fonts.load('700 40px "Zen Maru Gothic"'), document.fonts.load('700 40px "Fredoka"')]); } catch (e) {}
  var idx = []; try { idx = await fetch("/data/search-ja.json", { cache: "no-store" }).then(function (r) { return r.json(); }); } catch (e) {}
  var by = {}; idx.forEach(function (x) { by[x.id] = x; });
  var load = function (src) { return new Promise(function (ok) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ok(null); }; i.src = src; }); };
  var big = function (x) { return x && x.img ? "/" + x.img.replace("thumb/", "") : ""; };
  var c = document.createElement("canvas"); c.width = W; c.height = H; var g = c.getContext("2d");
  var rr = function (x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  var bg = function () { var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#fff1f6"); gr.addColorStop(1, "#eef6ff"); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  var fit = function (im, x, y, w, h, pad) { if (!im) return; pad = pad || 0; var s = Math.min((w - pad * 2) / im.width, (h - pad * 2) / im.height); var iw = im.width * s, ih = im.height * s; g.drawImage(im, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih); };
  var brand = function (y) {
    g.textBaseline = "middle"; g.textAlign = "right";
    g.font = "700 30px " + FL; var t2 = "PLANET", w2 = g.measureText(t2).width;
    g.fillStyle = "#3aa0ff"; g.fillText(t2, W - 40, y); g.fillStyle = "#ff4f7b"; g.fillText("GACHA ", W - 40 - w2, y);
    g.font = "700 18px " + F; g.fillStyle = "#6b7194"; g.fillText("gachapla.com", W - 40, y + 30); g.textAlign = "left";
  };
  var wrap = function (text, x, y, maxW, lh, maxLines) {
    var lines = [], cur = "";
    for (var ch of text) { if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch; }
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + "…"; }
    lines.forEach(function (l, i) { g.fillText(l, x, y + i * lh); }); return lines.length;
  };
  var badge = function (text, x, y, col) { g.font = "900 24px " + F; var w = g.measureText(text).width + 36; rr(x, y, w, 46, 23); g.fillStyle = col; g.fill(); g.fillStyle = "#fff"; g.textBaseline = "middle"; g.fillText(text, x + 18, y + 24); return w; };
  var name = "gachapla.jpg";
  if (kind === "week") {
    var im = await load("/images/og/week.jpg?v=" + Date.now()); c.width = 1200; c.height = 630; if (im) g.drawImage(im, 0, 0, 1200, 630); name = "week.jpg";
  } else if (kind === "feed") {
    // 写真を大きく：4つなら正方形の画像に2×2、3つなら横に3つ、2つなら横に2つ
    var ids = (q.get("ids") || "").split(",").filter(Boolean).slice(0, 4), title = q.get("title") || "ガチャ入荷速報";
    var n = ids.length || 1, cols = n === 4 ? 2 : n, rows = n === 4 ? 2 : 1, top = 96, gap = 14, side = 24;
    var gw = (1200 - side * 2 - (cols - 1) * gap) / cols, gh = gw + 46;
    W = 1200; H = top + rows * gh + (rows - 1) * gap + 24; c.width = W; c.height = H;
    bg(); badge("⚡ " + title, side, 26, "#ff4f7b"); brand(48);
    for (var i = 0; i < ids.length; i++) {
      var x = by[ids[i]], cx = side + (i % cols) * (gw + gap), cy = top + Math.floor(i / cols) * (gh + gap);
      rr(cx, cy, gw, gh, 20); g.fillStyle = "#fff"; g.fill();
      var im2 = await load(big(x)); g.save(); rr(cx, cy, gw, gw, 20); g.clip(); fit(im2, cx, cy, gw, gw, 4); g.restore();
      g.fillStyle = "#1f2440"; g.font = "700 " + (cols >= 3 ? 20 : 24) + "px " + F; g.textBaseline = "middle"; wrap(x ? x.n : "", cx + 16, cy + gw + 23, gw - 32, 26, 1);
    }
    name = "nyuka.jpg";
  } else {
    var x2 = by[q.get("id")] || {};
    bg();
    var im3 = await load(big(x2));
    rr(40, 96, W - 80, 400, 26); g.fillStyle = "#fff"; g.fill(); g.save(); rr(40, 96, W - 80, 400, 26); g.clip(); fit(im3, 40, 96, W - 80, 400, 12); g.restore();
    badge(q.get("label") || "注目の新作", 40, 30, "#3aa0ff"); brand(52);
    g.fillStyle = "#1f2440"; g.font = "900 34px " + F; g.textBaseline = "middle";
    var ln = wrap(x2.n || "", 44, 540, W - 88, 44, 2);
    g.font = "700 24px " + F; g.fillStyle = "#ff4f7b";
    g.fillText((x2.p ? "1回" + x2.p + "円" : "") + (x2.l ? "　全" + x2.l + "種" : "") + (x2.r ? "　" + x2.r : ""), 44, 540 + ln * 44 + 8);
    name = (q.get("id") || "pick") + ".jpg";
  }
  var url = c.toDataURL("image/jpeg", 0.88);
  var msg = { type: "gachapla-img", name: name, dataURL: url, kind: kind };
  if (window.parent !== window) window.parent.postMessage(msg, "https://x.com");
  if (window.opener) window.opener.postMessage(msg, "https://x.com");
  // 同じタブで x.com に移ると window.name は残るので、そこから画像を受け取れる（x.com は外のサイトの画像を読めないため）
  try { var prev = []; try { var o = JSON.parse(window.name || "{}"); if (o && o.type === "gachapla-imgs") prev = o.list || []; } catch (e) {} if (q.get("add") !== "1") prev = []; prev.push(msg); window.name = JSON.stringify({ type: "gachapla-imgs", list: prev }); } catch (e) {}
  window.__done = true;
  document.getElementById("st").textContent = "できました（" + Math.round(url.length * 0.75 / 1024) + "KB）";
  var img = new Image(); img.src = url; document.getElementById("out").appendChild(img);
})();
</script></body></html>
