<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 800px; height: 800px; background: radial-gradient(circle at 50% 45%, #ffffff 0 30%, #eef4ff 70%, #e3ecff 100%); position: relative; }
.planet { width: 660px; left: 70px; top: 70px; }
.ring { border-width: 24px; }
.moon { top: 8%; right: 8%; }
.txt { position: absolute; left: 0; right: 0; top: 218px; z-index: 10; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 700; line-height: 1.0; }
.txt span { display: block; color: #fff; -webkit-text-stroke: 16px #1d2140; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(29,33,64,.25); }
.txt .a { font-size: 190px; letter-spacing: 6px; }
.txt .b { font-size: 132px; letter-spacing: 10px; margin-top: 6px; }
.star.a { left: 95px; top: 110px; font-size: 54px; }
.star.b { right: 110px; bottom: 110px; font-size: 40px; color: #3aa0ff; }
</style>
<div class="planet"><i class="ring"></i><i class="orb"></i><i class="ring front"></i><i class="moon"></i></div>
<span class="star a">✦</span><span class="star b">✦</span>
<div class="txt"><span class="a">GACHA</span><span class="b">JAPAN</span></div>
