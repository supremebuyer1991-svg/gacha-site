<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 1500px; height: 500px; position: relative; font-family: "Zen Maru Gothic", sans-serif;
  background: radial-gradient(circle at 85% 30%, #fff 0 18%, transparent 45%), linear-gradient(135deg, #fff3f7 0%, #f3f6ff 45%, #e9f6ff 100%); }
body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#c9d0ea 1.6px, transparent 1.8px); background-size: 34px 34px; opacity: .45; }
.planet { width: 380px; right: 90px; top: 50px; }
.ring { border-width: 14px; }
.moon { top: 4%; right: 4%; }
.text { position: absolute; left: 150px; top: 105px; }
.logo { font: 700 88px/1 "Fredoka", sans-serif; letter-spacing: 3px; }
.logo .a { color: #ff4f7b; } .logo .b { color: #3aa0ff; }
.ja { margin-top: 14px; font-weight: 900; font-size: 30px; color: #1d2140; letter-spacing: 4px; }
.tag { margin-top: 22px; display: inline-block; background: #fff; border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 25px; color: #3d4363; box-shadow: 0 4px 0 #e3e7f5; }
.url { margin-top: 18px; font: 700 26px "Fredoka", sans-serif; color: #2ccfa6; letter-spacing: 1px; }
.c1 { width: 74px; left: 40px; top: 40px; background: linear-gradient(180deg,#ff8aa7 0 49%,#fff 49% 51%,#ffe08a 51%); }
.c2 { width: 52px; left: 860px; top: 380px; background: linear-gradient(180deg,#8fd0ff 0 49%,#fff 49% 51%,#a8f0dc 51%); }
.c3 { width: 40px; left: 1050px; top: 400px; background: linear-gradient(180deg,#c4b1ff 0 49%,#fff 49% 51%,#ffb3c6 51%); }
.c4 { width: 60px; left: 1380px; top: 390px; background: linear-gradient(180deg,#ffe08a 0 49%,#fff 49% 51%,#8fd0ff 51%); }
.star.a { left: 90px; top: 380px; } .star.b { left: 1000px; top: 60px; font-size: 30px; color: #ff4f7b; }
</style>
<i class="cap c1"></i><i class="cap c2"></i><i class="cap c3"></i><i class="cap c4"></i>
<span class="star a">✦</span><span class="star b">✦</span>
<div class="planet"><i class="ring"></i><i class="orb"></i><i class="ring front"></i><i class="moon"></i></div>
<div class="text">
  <div class="logo"><span class="a">GACHA</span> <span class="b">PLANET</span></div>
  <div class="ja">ガチャプラネット</div>
  <div class="tag">新作ガチャの発売日・ラインナップ・入荷情報</div>
  <div class="url">gachapla.com</div>
</div>
