<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロゴ候補</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@800;900&family=Zen+Maru+Gothic:wght@700;900&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
body{margin:0;background:#f6f7fc;font-family:"Zen Maru Gothic",sans-serif;color:#1f2440;padding:24px}
.row{display:flex;align-items:center;gap:24px;background:#fff;border-radius:18px;padding:18px 24px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,40,90,.06)}
.tag{width:34px;height:34px;border-radius:50%;background:#1f2440;color:#fff;display:grid;place-items:center;font:800 18px Nunito}
.sub{font-size:11px;color:#8a8fb0;font-weight:700;letter-spacing:.04em;margin-top:2px}
.planet{width:40px;height:40px;flex:none}
/* 今 */
.now b{font:700 26px Fredoka;letter-spacing:.06em}.now .g{color:#ff4f7b}.now .p{color:#3aa0ff}
/* A アイコン＋濃紺 */
.a{display:flex;align-items:center;gap:10px}.a b{font:700 26px Fredoka;letter-spacing:.02em;color:#1f2440}.a b i{font-style:normal;color:#ff4f7b}
/* B グラデーション */
.b b{font:700 28px Fredoka;letter-spacing:.03em;background:linear-gradient(90deg,#ff4f7b,#a855f7 55%,#3aa0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* C 日本語メイン */
.c small{display:block;font:700 11px Fredoka;letter-spacing:.32em;color:#3aa0ff}.c b{font:900 26px "Zen Maru Gothic";letter-spacing:.04em}.c b i{font-style:normal;color:#ff4f7b}
/* D ステッカー */
.d b{font:700 27px Fredoka;letter-spacing:.04em;color:#fff;-webkit-text-stroke:6px #1f2440;paint-order:stroke fill;text-shadow:3px 3px 0 #ffc93c}
/* E 小文字＋丸 */
.e{display:flex;align-items:center;gap:8px}.e b{font:700 28px Fredoka;letter-spacing:-.01em;color:#1f2440}.e b .g{color:#ff4f7b}.e b .p{color:#3aa0ff}
/* F カプセル枠 */
.f b{display:inline-flex;border-radius:999px;overflow:hidden;font:700 20px Fredoka;letter-spacing:.08em}.f b span{padding:6px 14px}.f .g{background:#ff4f7b;color:#fff}.f .p{background:#fff;color:#3aa0ff;border:3px solid #3aa0ff;border-left:0;border-radius:0 999px 999px 0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="pl" viewBox="0 0 48 48"><ellipse cx="24" cy="25" rx="22" ry="7" fill="none" stroke="#3aa0ff" stroke-width="3" transform="rotate(-18 24 25)"/><clipPath id="cp"><circle cx="24" cy="24" r="14"/></clipPath><g clip-path="url(#cp)"><rect x="8" y="8" width="32" height="15" fill="#ff5c8a"/><rect x="8" y="23" width="32" height="2.4" fill="#fff"/><rect x="8" y="25.4" width="32" height="16" fill="#ffc23c"/></g><path d="M4.5 31 A22 7 -18 0 0 44 19" fill="none" stroke="#3aa0ff" stroke-width="3" transform="rotate(0)"/></symbol></defs></svg>
<div class="row"><span class="tag">今</span><div class="now"><b><span class="g">GACHA</span> <span class="p">PLANET</span></b><div class="sub">ガチャガチャ情報まとめ</div></div></div>
<div class="row"><span class="tag">A</span><div class="a"><svg class="planet"><use href="#pl"/></svg><div><b>GACHA <i>PLANET</i></b><div class="sub">ガチャガチャ情報まとめ</div></div></div></div>
<div class="row"><span class="tag">B</span><div class="b"><b>GACHA PLANET</b><div class="sub">ガチャガチャ情報まとめ</div></div></div>
<div class="row"><span class="tag">C</span><div class="c"><small>GACHA PLANET</small><b>ガチャ<i>プラネット</i></b></div></div>
<div class="row"><span class="tag">D</span><div class="d"><b>GACHA PLANET</b><div class="sub">ガチャガチャ情報まとめ</div></div></div>
<div class="row"><span class="tag">E</span><div class="e"><svg class="planet"><use href="#pl"/></svg><div><b><span class="g">gacha</span><span class="p">planet</span></b><div class="sub">ガチャガチャ情報まとめ</div></div></div></div>
<div class="row"><span class="tag">F</span><div class="f"><b><span class="g">GACHA</span><span class="p">PLANET</span></b><div class="sub">ガチャガチャ情報まとめ</div></div></div>
</body></html>
